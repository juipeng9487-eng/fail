<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案照片</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #EFEFE6;
            color: #2C4A34;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .exp {
            max-width: 1500px;
            margin: auto;
            margin-top:125px;
            display: grid;
            grid-template-columns: repeat(2, 350px);
            justify-content: center;
            gap: 10px;
        }

        .exp img {
            width: 100%;            
            height:350px;
            object-fit: contain;
            border-radius: 12px;
            
        }
        
     

        .back {
            display: block;
            text-align: center;
            margin-top: 30px;
            color: #35533F;
        }

        .card1{
            display:grid;
            grid-column: 1/2;
        }

        .card2{
            display:grid;
            grid-column: 2/3;
        }

        .exp h3 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 10px;
            color:brown;
        }

        @media (max-width: 768px) {
            .exp {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>社團照片</h1>

    <div class="exp">

        

        <div>
            <h3>個人照</h3>
            <img src="image/project2.jpg" alt="個人照" class="card1">
        </div>

        <div>
            <h3>團體照</h3>
            <img src="image/project2_2.jpg" alt="團體照" class="card2">
        </div>

        
    </div>

    <a href="index.html" class="back">返回個人履歷</a>

</body>
</html>
